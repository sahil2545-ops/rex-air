<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REX Aerospace | Official Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        /* वीडियो को बैकग्राउंड में फिक्स करने के लिए */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* वीडियो पूरी स्क्रीन पर फैल जाएगी */
            z-index: -1;
        }

        /* वीडियो पर हल्का अंधेरा ताकि टेक्स्ट साफ़ दिखे */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        /* कंटेंट को ऊपर लाने के लिए */
        header, .container, .hero { position: relative; z-index: 1; }

        body { color: #ffffff; overflow-x: hidden; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 8%; background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 210, 255, 0.3);
            position: sticky; top: 0; z-index: 100;
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        .logo-text { font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; }
        .logo-text span { color: #00d2ff; }

        .launch-btn {
            background: linear-gradient(135deg, #00d2ff, #0044ff);
            color: #fff; padding: 8px 16px; border-radius: 20px; border: none;
            font-weight: 700; cursor: pointer;
        }

        #flying-rocket {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            font-size: 3.5rem; z-index: 999; pointer-events: none;
        }

        .hero { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: 3.5rem; font-weight: 900; margin-bottom: 15px; }
        .hero p { color: #ccc; max-width: 600px; margin-bottom: 30px; }

        /* बाकि सारा डिज़ाइन पहले जैसा */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .card { background: rgba(0,0,0,0.5); border: 1px solid rgba(0, 210, 255, 0.3); padding: 25px; border-radius: 15px; }
    </style>
</head>
<body>

    <!-- वीडियो बैकग्राउंड -->
    <video class="bg-video" autoplay loop muted playsinline>
        <source src="YTShort_06Aug2026.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div id="flying-rocket">🚀</div>

    <header>
        <div class="logo-container">
            <div class="logo-text">REX <span>AEROSPACE</span></div>
        </div>
        <button class="launch-btn" onclick="launchRocket()">🚀 Launch Rocket</button>
    </header>

    <section class="hero">
        <h1>POWERING THE FUTURE</h1>
        <p>Developing next-generation fusion propulsion engines.</p>
    </section>

    <div class="container">
        <div class="card">
            <h3>Propulsion Technology</h3>
            <p>Our fusion engine sets new records in deep space exploration.</p>
        </div>
    </div>

    <script>
        function launchRocket() {
            const rocket = document.getElementById('flying-rocket');
            rocket.style.transition = 'bottom 1.5s cubic-bezier(0.25, 1, 0.5, 1)';
            rocket.style.bottom = '110vh';
            setTimeout(() => { rocket.style.bottom = '-100px'; rocket.style.transition = 'none'; }, 1600);
        }
    </script>
</body>
</html>
