<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REX Aerospace | Official Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background-color: #000; color: #fff; overflow-x: hidden; }

        /* Video Background */
        .bg-video {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -2;
        }
        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5); z-index: -1;
        }

        /* Minimalist Navigation */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 5%; position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 4px; color: #fff; }
        .logo span { color: #00d2ff; }
        .nav-links a { 
            color: #fff; text-decoration: none; font-size: 0.9rem; margin-left: 20px;
            text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; transition: 0.3s;
        }
        .nav-links a:hover { opacity: 1; color: #00d2ff; }

        /* Main Hero Section */
        .hero {
            height: 80vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center;
        }
        .hero h1 { font-size: clamp(3rem, 8vw, 6rem); font-weight: 800; line-height: 1; margin-bottom: 20px; }
        .hero p { font-size: 1.2rem; color: #ccc; max-width: 600px; }

        /* Founder Section (Clean Style) */
        .info-section {
            padding: 80px 20px; max-width: 800px; margin: 0 auto;
            text-align: center; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .founder-name { font-size: 2rem; margin-bottom: 10px; }
        .founder-title { color: #00d2ff; text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem; }

        footer { text-align: center; padding: 40px; font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>

    <video class="bg-video" autoplay loop muted playsinline>
        <source src="YTShort_06Aug2026_23_32_58.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <header>
        <div class="logo">REX <span>AERO</span></div>
        <div class="nav-links">
            <a href="https://www.instagram.com/rexaerospace?igsh=cnR2M3d2M2ZzZDZi">Instagram</a>
        </div>
    </header>

    <main class="hero">
        <h1>POWERING THE FUTURE</h1>
        <p>Designing next-generation fusion propulsion engines for interplanetary exploration.</p>
    </main>

    <section class="info-section">
        <div class="founder-title">FOUNDER & CHIEF ARCHITECT</div>
        <h2 class="founder-name">SAHIL</h2>
        <p style="color: #888;">Leading REX Aerospace with a vision for sustainable deep space transit.</p>
    </section>

    <footer>
        &copy; 2026 REX AEROSPACE. ALL RIGHTS RESERVED.
    </footer>

</body>
</html>
