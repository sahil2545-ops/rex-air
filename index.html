<!DOCTYPE html>
<html lang="hi">
<head>
    <!-- 👇 1. अपना Google Verification content कोड यहाँ डालें 👇 -->
    <meta name="google-site-verification" content="यहाँ_अपना_गूगल_कोड_content_डालें" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REX Aerospace | Official Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background-color: #000; color: #fff; overflow-x: hidden; }

        /* Video Background */
        .bg-video {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -2;
        }
        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.55); z-index: -1;
        }

        /* Header Navigation */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 6%; position: sticky; top: 0; z-index: 100;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
        }

        /* Golden Logo & Name Container */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        /* SVG Logo - Golden Style */
        .rex-logo-svg {
            width: 42px;
            height: 42px;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.5));
        }

        /* Golden REX Text */
        .logo-text {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #FFE57F 0%, #D4AF37 50%, #AA7C11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links a { 
            color: #fff; text-decoration: none; font-size: 0.85rem; margin-left: 20px;
            text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.8; transition: 0.3s;
        }
        .nav-links a:hover { opacity: 1; color: #D4AF37; }

        /* Main Hero Section */
        .hero {
            height: 80vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center;
            padding: 0 20px;
        }
        .hero h1 { font-size: clamp(2.5rem, 7vw, 5.5rem); font-weight: 800; line-height: 1.1; margin-bottom: 20px; letter-spacing: 2px; }
        .hero p { font-size: 1.1rem; color: #ccc; max-width: 600px; line-height: 1.6; }

        /* Founder Section */
        .info-section {
            padding: 60px 20px; max-width: 800px; margin: 0 auto;
            text-align: center; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .founder-name { font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; }
        .founder-title { color: #D4AF37; text-transform: uppercase; letter-spacing: 2px; font-size: 0.85rem; margin-bottom: 12px; }

        footer { text-align: center; padding: 40px; font-size: 0.8rem; color: #666; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- Background Video -->
    <video class="bg-video" autoplay loop muted playsinline>
        <source src="YTShort_06Aug2026_23_32_58.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <header>
        <!-- Exact Golden Crown + Swoosh + Golden REX Text -->
        <a href="#" class="brand-container">
            <svg class="rex-logo-svg" viewBox="0 0 120 120">
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFE57F" />
                        <stop offset="50%" stop-color="#D4AF37" />
                        <stop offset="100%" stop-color="#AA7C11" />
                    </linearGradient>
                </defs>
                <!-- Crown Points -->
                <path d="M 25,58 L 15,28 L 42,46 L 60,15 L 78,46 L 105,28 L 95,58 Z" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
                <!-- Base Bar under Crown -->
                <line x1="28" y1="68" x2="92" y2="68" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
                <!-- Long Swoosh Swooping From Left Bottom to Top Right -->
                <path d="M 20,102 Q 70,95 108,35" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
            </svg>
            <div class="logo-text">REX</div>
        </a>

        <div class="nav-links">
            <a href="https://www.instagram.com/rexaerospace?igsh=cnR2M3d2M2ZzZDZi" target="_blank">Instagram</a>
        </div>
    </header>

    <main class="hero">
        <h1>POWERING THE FUTURE</h1>
        <p>Designing next-generation fusion propulsion engines for interplanetary exploration.</p>
    </main>

    <section class="info-section">
        <div class="founder-title">FOUNDER & CHIEF ARCHITECT</div>
        <h2 class="founder-name">SAHIL</h2>
        <p style="color: #888; font-size: 0.95rem;">Leading REX Aerospace with a vision for sustainable deep space transit.</p>
    </section>

    <footer>
        &copy; 2026 REX AEROSPACE. ALL RIGHTS RESERVED.
    </footer>

</body>
</html>
